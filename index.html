<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎸ChordFlow Studio</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-h: #334155;
            --primary: #6366f1;
            --accent: #8b5cf6;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--surface);
            height: 65px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.5px;

            /* ここからグラデーションの設定 */
            background: linear-gradient(90deg, #11998e, #38ef7d);
            /* 紫〜ピンク系のグラデーション */
            -webkit-background-clip: text;
            /* 背景を文字の形に切り抜く（Safari/Chrome用） */
            background-clip: text;
            /* 背景を文字の形に切り抜く */
            color: transparent;
            /* 本来の文字色を透明にして背景を見せる */

            display: inline-block;
            /* グラデーションを正しく適用させるために必要 */
        }

        #saveStatus {
            font-size: 0.6rem;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .bpm-input {
            width: 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            height: 35px;
        }

        .btn {
            height: 36px;
            padding: 0 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.85rem;
        }

        .btn-play {
            background: var(--success);
            min-width: 80px;
        }

        .btn-stop {
            background: var(--danger);
            min-width: 80px;
        }

        .btn-sub {
            background: var(--surface-h);
            border: 1px solid var(--border);
        }

        /* Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar (Desktop) */
        .sidebar {
            width: 160px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .side-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .palette-item {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            background: var(--surface-h);
            border-left: 4px solid #ccc;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Timeline */
        .timeline {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .section-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            border-left: 6px solid #ccc;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .sec-title {
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sec-ctrl {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .repeat-input {
            width: 40px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--accent);
            border-radius: 4px;
            text-align: center;
            font-size: 0.8rem;
            height: 28px;
        }

        .beat-select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 28px;
            font-size: 0.75rem;
        }

        /* Grid */
        .measure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .measure {
            background: var(--bg);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid var(--border);
            position: relative;
        }

        .measure.active {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .beats-row {
            display: grid;
            gap: 5px;
            margin-top: 8px;
        }

        .beat-slot {
            height: 45px;
            background: var(--surface-h);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .beat-slot.current {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--primary);
            z-index: 5;
        }

        .beat-slot.empty {
            color: #334155;
        }

        /* Picker Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            backdrop-filter: blur(3px);
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            display: none;
            z-index: 201;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .pick-btn {
            height: 40px;
            background: var(--surface-h);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .pick-btn:active {
            background: var(--primary);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 70px;
                flex-direction: row;
                border-right: none;
                border-top: 1px solid var(--border);
                padding: 8px;
                overflow-x: auto;
            }

            .side-label {
                display: none;
            }

            .palette-item {
                min-width: 70px;
                font-size: 0.7rem;
                padding: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .timeline {
                padding-bottom: 80px;
            }

            .modal {
                top: auto;
                bottom: 10px;
                transform: translate(-50%, 0);
                width: 96%;
            }

            .btn-sub span {
                display: none;
            }

            /* Hide text on small buttons */
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-group">
            <div class="logo">🎸ChordFlow Studio</div>
            <div id="saveStatus">✓ Auto-saved</div>
        </div>
        <div class="controls">
            <div
                style="display:flex; align-items:center; background:var(--surface-h); padding:0 8px; border-radius:6px; height:35px;">
                <span style="font-size:0.6rem; color:var(--muted); margin-right:5px;">BPM</span>
                <input type="number" id="bpm" class="bpm-input" value="120">
            </div>
            <input type="file" id="fileInput" accept=".json" style="display:none">
            <button class="btn btn-sub" onclick="document.getElementById('fileInput').click()">📂
                <span>Import</span></button>
            <button class="btn btn-sub" onclick="exportFile()">💾 <span>Export</span></button>
            <button class="btn btn-play" id="playBtn">▶ PLAY</button>
        </div>
    </header>

    <div class="workspace">
        <div class="sidebar" id="sidebar">
            <div class="side-label">Add Section</div>
            <div class="palette-item" onclick="addSec('Intro')" style="border-color:#3b82f6">Intro</div>
            <div class="palette-item" onclick="addSec('Verse')" style="border-color:#10b981">Verse</div>
            <div class="palette-item" onclick="addSec('Chorus')" style="border-color:#f43f5e">Chorus</div>
            <div class="palette-item" onclick="addSec('Solo')" style="border-color:#f59e0b">Solo</div>
            <button class="btn btn-sub" id="pasteBtn" onclick="pasteSec()" disabled style="font-size:0.7rem;">📋
                Paste</button>
            <button class="btn" onclick="resetAll()" style="background:#ef4444; font-size:0.6rem; margin-top:auto;">✕
                RESET</button>
        </div>

        <div class="timeline" id="timeline">
            <div id="content"></div>
            <div id="hint"
                style="text-align:center; padding:50px; color:var(--muted); border:2px dashed var(--border); border-radius:15px; margin-top:10px;">
                サイドバーの項目をタップしてセクションを追加
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div class="modal" id="picker">
        <div id="preview"
            style="text-align:center; font-size:2.5rem; font-weight:900; color:var(--primary); margin-bottom:15px; height:50px;">
            C</div>
        <div class="picker-grid" id="rootGrid"></div>
        <div class="picker-grid" id="suffixGrid" style="grid-template-columns: repeat(4, 1fr);"></div>
        <input type="text" id="customInput" placeholder="Custom (e.g. F#m7-5)"
            style="width:100%; height:40px; background:var(--bg); border:1px solid var(--border); color:white; border-radius:8px; padding:0 10px; margin-bottom:15px;">
        <div style="display:flex; gap:10px;">
            <button class="btn" style="flex:1; background:var(--surface-h)" onclick="applyChord('')">Clear</button>
            <button class="btn" style="flex:1; background:var(--primary)" onclick="applyChord()">Apply</button>
        </div>
    </div>

    <script>
        // --- Global State ---
        let songData = [];
        let isPlaying = false;
        let playTimer = null;
        let playState = { s: 0, m: 0, b: -1, r: 1 };
        let editing = { s: 0, m: 0, b: 0, root: 'C', suf: '' };
        let clipboard = null;

        const AUTOSAVE_KEY = 'chordflow_save_v8';
        const ROOTS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const SUFFIXES = ['', 'm', '7', 'm7', 'maj7', 'sus4', 'dim', 'aug', '6', '9', 'add9', 'm7-5'];
        const COLORS = { 'Intro': '#3b82f6', 'Verse': '#10b981', 'Chorus': '#f43f5e', 'Solo': '#f59e0b' };

        // --- initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            buildPickerUI();
            loadFromStorage();

            // Event Listeners
            document.getElementById('playBtn').onclick = togglePlay;
            document.getElementById('overlay').onclick = closePicker;
            document.getElementById('bpm').onchange = autoSave;
            document.getElementById('fileInput').onchange = (e) => importFile(e);

            render();
        });

        // --- Core Logic ---
        function render() {
            const cont = document.getElementById('content');
            const hint = document.getElementById('hint');
            cont.innerHTML = '';

            if (songData.length === 0) {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
                songData.forEach((sec, sIdx) => {
                    cont.appendChild(createSectionDOM(sec, sIdx));
                });
            }

            document.getElementById('pasteBtn').disabled = !clipboard;
            autoSave();
        }

        function createSectionDOM(sec, sIdx) {
            const color = COLORS[sec.type] || '#8b5cf6';
            const card = document.createElement('div');
            card.className = 'section-card';
            card.style.borderLeftColor = color;

            // Header
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
            <div class="sec-title"><span style="color:#444">⠿</span> <span style="color:${color}">${sec.type}</span></div>
            <div class="sec-ctrl">
                <span style="font-size:0.7rem; color:var(--muted)">Loop:</span>
                <input type="number" class="repeat-input" value="${sec.repeat || 1}" min="1" onchange="updateRepeat(${sIdx}, this.value)">
                <select class="beat-select" onchange="updateBeats(${sIdx}, this.value)">
                    <option value="2" ${sec.beats == 2 ? 'selected' : ''}>2/4</option>
                    <option value="3" ${sec.beats == 3 ? 'selected' : ''}>3/4</option>
                    <option value="4" ${sec.beats == 4 ? 'selected' : ''}>4/4</option>
                    <option value="6" ${sec.beats == 6 ? 'selected' : ''}>6/8</option>
                    <option value="8" ${sec.beats == 8 ? 'selected' : ''}>8/8</option>
                </select>
                <button class="btn btn-sub" style="width:28px; height:28px; padding:0" onclick="copySec(${sIdx})">📋</button>
                <button class="btn btn-sub" style="width:28px; height:28px; padding:0" onclick="removeSec(${sIdx})">✕</button>
            </div>
        `;
            card.appendChild(header);

            // Grid
            const grid = document.createElement('div');
            grid.className = 'measure-grid';

            sec.measures.forEach((m, mIdx) => {
                const mDiv = document.createElement('div');
                mDiv.className = 'measure';
                mDiv.id = `m-${sIdx}-${mIdx}`;

                // Measure Label & Remove
                const mHead = document.createElement('div');
                mHead.style = "display:flex; justify-content:space-between; font-size:0.55rem; color:var(--muted); font-weight:bold;";
                mHead.innerHTML = `<span>MEASURE ${mIdx + 1}</span><span style="cursor:pointer" onclick="removeMeasure(${sIdx},${mIdx})">✕</span>`;
                mDiv.appendChild(mHead);

                // Beats
                const bRow = document.createElement('div');
                bRow.className = 'beats-row';
                // 6 or 8 beats logic for grid columns
                const cols = sec.beats > 4 ? 4 : sec.beats;
                bRow.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

                m.forEach((chord, bIdx) => {
                    const slot = document.createElement('div');
                    slot.className = `beat-slot ${chord ? '' : 'empty'}`;
                    slot.id = `b-${sIdx}-${mIdx}-${bIdx}`;
                    slot.innerText = chord || '•';
                    slot.onclick = () => openPicker(sIdx, mIdx, bIdx);
                    bRow.appendChild(slot);
                });
                mDiv.appendChild(bRow);
                grid.appendChild(mDiv);
            });

            // Add Measure Button
            const addM = document.createElement('div');
            addM.className = 'beat-slot';
            addM.style = "border:1px dashed var(--border); height:80px; color:var(--muted)";
            addM.innerText = "+ Add Measure";
            addM.onclick = () => addMeasure(sIdx);
            grid.appendChild(addM);

            card.appendChild(grid);
            return card;
        }

        // --- Actions ---
        function addSec(type) {
            songData.push({ type: type, beats: 4, repeat: 1, measures: [['', '', '', '']] });
            render();
            const t = document.getElementById('timeline');
            setTimeout(() => t.scrollTop = t.scrollHeight, 50);
        }
        function removeSec(i) { if (confirm("Delete section?")) { songData.splice(i, 1); render(); } }
        function copySec(i) { clipboard = JSON.parse(JSON.stringify(songData[i])); render(); }
        function pasteSec() { if (clipboard) { songData.push(JSON.parse(JSON.stringify(clipboard))); render(); } }

        function addMeasure(sIdx) {
            const b = songData[sIdx].beats;
            songData[sIdx].measures.push(new Array(b).fill(''));
            render();
        }
        function removeMeasure(s, m) { songData[s].measures.splice(m, 1); render(); }

        function updateRepeat(s, val) { songData[s].repeat = parseInt(val) || 1; autoSave(); }
        function updateBeats(s, val) {
            const nb = parseInt(val);
            songData[s].beats = nb;
            songData[s].measures = songData[s].measures.map(m => {
                let nm = new Array(nb).fill('');
                for (let i = 0; i < Math.min(m.length, nb); i++) nm[i] = m[i];
                return nm;
            });
            render();
        }

        // --- Picker ---
        function buildPickerUI() {
            const rg = document.getElementById('rootGrid');
            ROOTS.forEach(r => {
                const d = document.createElement('div'); d.className = 'pick-btn'; d.innerText = r;
                d.onclick = () => { editing.root = r; updatePreview(); }; rg.appendChild(d);
            });
            const sg = document.getElementById('suffixGrid');
            SUFFIXES.forEach(s => {
                const d = document.createElement('div'); d.className = 'pick-btn'; d.innerText = s || 'M';
                d.onclick = () => { editing.suf = s; updatePreview(); }; sg.appendChild(d);
            });
            document.getElementById('customInput').oninput = updatePreview;
        }
        function openPicker(s, m, b) {
            editing = { s, m, b, root: 'C', suf: '' };
            document.getElementById('customInput').value = songData[s].measures[m][b];
            updatePreview();
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('picker').style.display = 'block';
        }
        function closePicker() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('picker').style.display = 'none';
        }
        function updatePreview() {
            document.getElementById('preview').innerText = document.getElementById('customInput').value || (editing.root + editing.suf);
        }
        function applyChord(val) {
            const final = (val === '') ? '' : (document.getElementById('customInput').value || (editing.root + editing.suf));
            songData[editing.s].measures[editing.m][editing.b] = final;
            render();
            closePicker();
        }

        // --- Audio Engine ---
        function togglePlay() { isPlaying ? stop() : play(); }
        function play() {
            if (songData.length === 0) return;
            isPlaying = true;
            const btn = document.getElementById('playBtn');
            btn.innerText = '■ STOP'; btn.className = 'btn btn-stop';
            playState = { s: 0, m: 0, b: -1, r: 1 };
            playLoop();
        }
        function stop() {
            isPlaying = false; clearTimeout(playTimer);
            const btn = document.getElementById('playBtn');
            btn.innerText = '▶ PLAY'; btn.className = 'btn btn-play';
            document.querySelectorAll('.current, .active').forEach(e => e.classList.remove('current', 'active'));
        }
        function playLoop() {
            if (!isPlaying) return;
            const curSec = songData[playState.s];
            if (!curSec) { stop(); return; }

            playState.b++;
            if (playState.b >= curSec.beats) { playState.b = 0; playState.m++; }
            if (playState.m >= curSec.measures.length) {
                if (playState.r < (curSec.repeat || 1)) { playState.m = 0; playState.r++; }
                else { playState.m = 0; playState.s++; playState.r = 1; }
            }

            if (!songData[playState.s]) { stop(); return; }

            // UI
            document.querySelectorAll('.current').forEach(e => e.classList.remove('current'));
            if (playState.b === 0) {
                document.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
                const m = document.getElementById(`m-${playState.s}-${playState.m}`);
                if (m) { m.classList.add('active'); m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
            const b = document.getElementById(`b-${playState.s}-${playState.m}-${playState.b}`);
            if (b) b.classList.add('current');

            // Timing
            let interval = (60 / (document.getElementById('bpm').value || 120)) * 1000;
            if (songData[playState.s].beats === 6 || songData[playState.s].beats === 8) interval *= 0.5;
            playTimer = setTimeout(playLoop, interval);
        }

        // --- Storage & Files ---
        function autoSave() {
            const state = { bpm: document.getElementById('bpm').value, data: songData };
            localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
            const s = document.getElementById('saveStatus');
            s.style.opacity = 1; setTimeout(() => s.style.opacity = 0, 1500);
        }
        function loadFromStorage() {
            const saved = localStorage.getItem(AUTOSAVE_KEY);
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    songData = p.data || [];
                    document.getElementById('bpm').value = p.bpm || 120;
                } catch (e) { console.error("Load failed"); }
            }
        }
        function exportFile() {
            const blob = new Blob([JSON.stringify({ bpm: document.getElementById('bpm').value, data: songData })], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `my_song_${new Date().getTime()}.json`;
            a.click();
        }
        function importFile(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const p = JSON.parse(ev.target.result);
                    if (p.data) { songData = p.data; document.getElementById('bpm').value = p.bpm || 120; render(); }
                } catch (err) { alert("Invalid file"); }
            };
            reader.readAsText(e.target.files[0]);
        }
        function resetAll() { if (confirm("Reset everything?")) { songData = []; render(); } }

    </script>
</body>

</html>
