<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChordFlow Professional</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-h: #334155;
            --primary: #6366f1;
            --accent: #8b5cf6;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--surface);
            height: 65px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .bpm-input {
            width: 55px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            height: 38px;
        }

        .btn {
            height: 40px;
            padding: 0 15px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
            user-select: none;
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .btn-play {
            background: var(--success);
            min-width: 90px;
        }

        .btn-stop {
            background: var(--danger);
            min-width: 90px;
        }

        .btn-icon {
            background: var(--surface-h);
            width: 40px;
            padding: 0;
            font-size: 1.1rem;
        }

        /* Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 170px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .palette-item {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            background: var(--surface-h);
            border-left: 5px solid #ccc;
            cursor: grab;
            user-select: none;
            font-size: 0.9rem;
        }

        .timeline {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .section-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            border-left: 8px solid #ccc;
            position: relative;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            user-select: none;
        }

        .section-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: move;
        }

        /* Section Controls */
        .sec-ctrl {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .beat-select {
            background: var(--bg);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .measure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .measure {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            position: relative;
        }

        .measure.active {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .beats-row {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .beat-slot {
            height: 55px;
            background: var(--surface-h);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
        }

        .beat-slot:hover {
            background: #404e63;
        }

        .beat-slot.current {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 0 20px var(--primary);
        }

        .beat-slot.empty {
            color: #444;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border);
            display: none;
            z-index: 201;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .pick-btn {
            height: 45px;
            background: var(--surface-h);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
        }

        .pick-btn:hover {
            border-color: var(--primary);
        }

        .pick-btn.selected {
            background: var(--primary);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .modal {
                top: auto;
                bottom: 0;
                left: 0;
                transform: translateY(100%);
                width: 100%;
                max-width: none;
                border-radius: 20px 20px 0 0;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .modal.show {
                transform: translateY(0);
                display: block;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🎸ChordFlow Studio</div>
        <div class="controls">
            <div
                style="display:flex; align-items:center; background:var(--surface-h); padding:0 10px; border-radius:8px; gap:8px;">
                <span style="font-size:0.7rem; color:var(--muted)">BPM</span>
                <input type="number" id="bpm" class="bpm-input" value="120">
            </div>
            <button class="btn btn-icon" onclick="openLib()">📂</button>
            <button class="btn btn-icon" onclick="saveSong()">💾</button>
            <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
        </div>
    </header>

    <div class="workspace">
        <div class="sidebar">
            <div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Templates
            </div>
            <div class="palette-item" draggable="true" data-type="Intro" ondragstart="evDragStart(event)"
                style="border-color:#3b82f6">Intro</div>
            <div class="palette-item" draggable="true" data-type="Verse" ondragstart="evDragStart(event)"
                style="border-color:#10b981">Verse</div>
            <div class="palette-item" draggable="true" data-type="Chorus" ondragstart="evDragStart(event)"
                style="border-color:#f43f5e">Chorus</div>
            <div class="palette-item" draggable="true" data-type="Solo" ondragstart="evDragStart(event)"
                style="border-color:#f59e0b">Solo</div>
            <button class="btn" onclick="addCustom()"
                style="background:none; border:1px dashed #444; color:var(--muted); width:100%; margin-top:10px;">+
                Custom</button>
        </div>

        <div class="timeline" id="timeline" ondragover="event.preventDefault()" ondrop="evDrop(event)">
            <div id="content"></div>
            <div id="hint"
                style="text-align:center; padding:60px; color:var(--muted); border:2px dashed var(--border); border-radius:20px; margin-top:20px;">
                サイドバーからセクションをドラッグして開始
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closePicker()"></div>
    <div class="modal" id="picker">
        <div id="preview"
            style="text-align:center; font-size:2.8rem; font-weight:900; color:var(--primary); margin-bottom:20px; height:60px;">
            C</div>
        <div class="picker-grid" id="rootGrid"></div>
        <div class="picker-grid" id="suffixGrid" style="grid-template-columns: repeat(4, 1fr);"></div>
        <input type="text" id="customInput" placeholder="Custom (e.g. F#m7-5)"
            style="width:100%; height:45px; background:var(--bg); border:1px solid var(--border); color:white; border-radius:8px; padding:0 15px; margin-bottom:20px;">
        <div style="display:flex; gap:10px;">
            <button class="btn" style="flex:1; background:var(--surface-h)" onclick="applyChord('')">Clear</button>
            <button class="btn" style="flex:1; background:var(--primary)" onclick="applyChord()">Apply</button>
        </div>
    </div>

    <div class="modal" id="libModal" style="display:none; max-height:80%; overflow-y:auto;">
        <h3 style="margin-top:0">My Library</h3>
        <div id="songList" style="border:1px solid var(--border); border-radius:10px;"></div>
        <button class="btn" style="width:100%; margin-top:20px; background:var(--surface-h)"
            onclick="closePicker()">Close</button>
    </div>

    <script>
        let songData = [];
        let isPlaying = false, playTimer = null;
        let playState = { s: 0, m: 0, b: -1 };
        let editing = { s: 0, m: 0, b: 0, root: 'C', suf: '' };

        const ROOTS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const SUFFIXES = ['', 'm', '7', 'm7', 'maj7', 'sus4', 'dim', 'aug', '6', '9', 'add9', 'm7-5'];
        const COLORS = { 'Intro': '#3b82f6', 'Verse': '#10b981', 'Chorus': '#f43f5e', 'Solo': '#f59e0b' };

        function init() {
            buildPicker();
            render();
        }

        function render() {
            const cont = document.getElementById('content');
            const hint = document.getElementById('hint');
            cont.innerHTML = '';
            hint.style.display = songData.length ? 'none' : 'block';

            songData.forEach((sec, sIdx) => {
                const color = COLORS[sec.type] || '#8b5cf6';
                const card = document.createElement('div');
                card.className = 'section-card';
                card.style.borderLeftColor = color;
                card.draggable = true;
                card.ondragstart = (e) => { e.dataTransfer.setData('moveIdx', sIdx); card.style.opacity = '0.4'; };
                card.ondragend = () => card.style.opacity = '1';

                card.innerHTML = `
                <div class="section-header">
                    <div class="section-title-area">
                        <span style="color:var(--muted); font-size:1.2rem;">⠿</span>
                        <span style="font-weight:900; color:${color}">${sec.type}</span>
                    </div>
                    <div class="sec-ctrl">
                        <select class="beat-select" onchange="changeSecBeats(${sIdx}, this.value)">
                            <option value="2" ${sec.beats == 2 ? 'selected' : ''}>2/4</option>
                            <option value="3" ${sec.beats == 3 ? 'selected' : ''}>3/4</option>
                            <option value="4" ${sec.beats == 4 ? 'selected' : ''}>4/4</option>
                            <option value="6" ${sec.beats == 6 ? 'selected' : ''}>6/8</option>
                        </select>
                        <button onclick="moveSec(${sIdx},-1)" class="btn btn-icon" style="width:28px; height:28px; font-size:0.7rem;">↑</button>
                        <button onclick="moveSec(${sIdx},1)" class="btn btn-icon" style="width:28px; height:28px; font-size:0.7rem;">↓</button>
                        <button onclick="remSec(${sIdx})" class="btn btn-icon" style="width:28px; height:28px; font-size:0.7rem; background:none;">✕</button>
                    </div>
                </div>
                <div class="measure-grid"></div>
            `;
                const grid = card.querySelector('.measure-grid');
                sec.measures.forEach((m, mIdx) => {
                    const mDiv = document.createElement('div');
                    mDiv.className = 'measure'; mDiv.id = `m-${sIdx}-${mIdx}`;
                    mDiv.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--muted); margin-bottom:5px;">
                        <span>MEASURE ${mIdx + 1}</span>
                        <span onclick="remMeas(${sIdx},${mIdx})" style="cursor:pointer;">✕</span>
                    </div>
                    <div class="beats-row" style="grid-template-columns: repeat(${sec.beats}, 1fr)"></div>
                `;
                    const brow = mDiv.querySelector('.beats-row');
                    m.forEach((chord, bIdx) => {
                        const slot = document.createElement('div');
                        slot.className = `beat-slot ${chord ? '' : 'empty'}`;
                        slot.id = `b-${sIdx}-${mIdx}-${bIdx}`;
                        slot.innerText = chord || '•';
                        slot.onclick = () => openPicker(sIdx, mIdx, bIdx);
                        brow.appendChild(slot);
                    });
                    grid.appendChild(mDiv);
                });
                const addM = document.createElement('div');
                addM.className = 'beat-slot'; addM.style.height = '90px'; addM.style.border = '2px dashed #2d3748'; addM.innerText = '＋';
                addM.onclick = () => { songData[sIdx].measures.push(new Array(sec.beats).fill('')); render(); };
                grid.appendChild(addM);
                cont.appendChild(card);
            });
        }

        // Actions
        function changeSecBeats(sIdx, val) {
            const newBeats = parseInt(val);
            songData[sIdx].beats = newBeats;
            songData[sIdx].measures = songData[sIdx].measures.map(m => {
                let newM = new Array(newBeats).fill('');
                for (let i = 0; i < Math.min(m.length, newBeats); i++) newM[i] = m[i];
                return newM;
            });
            render();
        }

        function evDragStart(e) { e.dataTransfer.setData('addType', e.target.dataset.type); }
        function evDrop(e) {
            e.preventDefault();
            const addType = e.dataTransfer.getData('addType');
            const moveIdx = e.dataTransfer.getData('moveIdx');
            if (addType) { songData.push({ type: addType, beats: 4, measures: [['', '', '', '']] }); }
            else if (moveIdx !== "") {
                const target = e.target.closest('.section-card');
                if (target) {
                    const targetIdx = Array.from(target.parentNode.children).indexOf(target);
                    const item = songData.splice(moveIdx, 1)[0];
                    songData.splice(targetIdx, 0, item);
                }
            }
            render();
        }

        function moveSec(idx, dir) {
            const t = idx + dir;
            if (t >= 0 && t < songData.length) { [songData[idx], songData[t]] = [songData[t], songData[idx]]; render(); }
        }
        function addCustom() { const n = prompt("Section Name?"); if (n) { songData.push({ type: n, beats: 4, measures: [['', '', '', '']] }); render(); } }
        function remSec(i) { if (confirm("Delete this section?")) { songData.splice(i, 1); render(); } }
        function remMeas(s, m) { songData[s].measures.splice(m, 1); render(); }

        // Picker Logic
        function buildPicker() {
            const rg = document.getElementById('rootGrid');
            ROOTS.forEach(r => {
                const b = document.createElement('div'); b.className = 'pick-btn'; b.innerText = r;
                b.onclick = () => { editing.root = r; updatePrv(); }; rg.appendChild(b);
            });
            const sg = document.getElementById('suffixGrid');
            SUFFIXES.forEach(s => {
                const b = document.createElement('div'); b.className = 'pick-btn'; b.innerText = s || 'M';
                b.onclick = () => { editing.suf = s; updatePrv(); }; sg.appendChild(b);
            });
            document.getElementById('customInput').oninput = updatePrv;
        }

        function openPicker(s, m, b) {
            editing = { s, m, b, root: 'C', suf: '' };
            document.getElementById('customInput').value = songData[s].measures[m][b];
            updatePrv();
            document.getElementById('overlay').style.display = 'block';
            const p = document.getElementById('picker');
            p.style.display = 'block';
            setTimeout(() => p.classList.add('show'), 10);
        }

        function closePicker() {
            document.getElementById('overlay').style.display = 'none';
            const p = document.getElementById('picker');
            p.classList.remove('show'); p.style.display = 'none';
            document.getElementById('libModal').style.display = 'none';
        }

        function updatePrv() {
            document.getElementById('preview').innerText = document.getElementById('customInput').value || (editing.root + editing.suf);
        }

        function applyChord(val) {
            const final = (val === '') ? '' : (document.getElementById('customInput').value || (editing.root + editing.suf));
            songData[editing.s].measures[editing.m][editing.b] = final;
            render();
            closePicker();
        }

        // Playback
        function togglePlay() { isPlaying ? stop() : play(); }
        function play() {
            if (!songData.length) return;
            isPlaying = true; document.getElementById('playBtn').innerText = '■ STOP'; document.getElementById('playBtn').className = 'btn btn-stop';
            playState = { s: 0, m: 0, b: -1 }; playLoop();
        }
        function stop() {
            isPlaying = false; clearTimeout(playTimer);
            document.getElementById('playBtn').innerText = '▶ PLAY'; document.getElementById('playBtn').className = 'btn btn-play';
            document.querySelectorAll('.current, .active').forEach(e => e.classList.remove('current', 'active'));
        }
        function playLoop() {
            if (!isPlaying) return;
            const currentSec = songData[playState.s];
            if (!currentSec) { stop(); return; }

            playState.b++;
            if (playState.b >= currentSec.beats) { playState.b = 0; playState.m++; }
            if (playState.m >= currentSec.measures.length) { playState.m = 0; playState.s++; }

            if (!songData[playState.s]) { stop(); return; }

            document.querySelectorAll('.current').forEach(e => e.classList.remove('current'));
            if (playState.b === 0) {
                document.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
                const m = document.getElementById(`m-${playState.s}-${playState.m}`);
                if (m) { m.classList.add('active'); m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
            const b = document.getElementById(`b-${playState.s}-${playState.m}-${playState.b}`);
            if (b) b.classList.add('current');

            playTimer = setTimeout(playLoop, (60 / document.getElementById('bpm').value) * 1000);
        }

        // Library
        const KEY = 'chordFlow_pro_v4';
        function saveSong() {
            const n = prompt("Song Title?"); if (!n) return;
            const lib = JSON.parse(localStorage.getItem(KEY) || '{}');
            lib[n] = { bpm: document.getElementById('bpm').value, data: songData };
            localStorage.setItem(KEY, JSON.stringify(lib)); alert("Saved!");
        }
        function openLib() {
            const lib = JSON.parse(localStorage.getItem(KEY) || '{}');
            const list = document.getElementById('songList'); list.innerHTML = '';
            Object.keys(lib).forEach(n => {
                const item = document.createElement('div');
                item.style = "display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #333; cursor:pointer;";
                item.innerHTML = `<span style="flex:1; font-weight:bold;" onclick="loadSong('${n}')">${n}</span><span onclick="delSong('${n}')">🗑</span>`;
                list.appendChild(item);
            });
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('libModal').style.display = 'block';
        }
        function loadSong(n) {
            const lib = JSON.parse(localStorage.getItem(KEY));
            songData = lib[n].data; document.getElementById('bpm').value = lib[n].bpm;
            render(); closePicker();
        }
        function delSong(n) { if (confirm("Delete?")) { const lib = JSON.parse(localStorage.getItem(KEY)); delete lib[n]; localStorage.setItem(KEY, JSON.stringify(lib)); openLib(); } }

        init();
    </script>
</body>

</html>
